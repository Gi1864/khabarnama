<!DOCTYPE html>
<html lang="ur" dir="rtl">
  <link rel="manifest" href="manifest.json">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>خبر نامہ | Inshorts Urdu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #ff9933;
      --secondary: #138808;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Noto Sans Arabic', Tahoma, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 54px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.15rem;
    }

    .brand-text {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .snap-container {
      height: 100vh;
      width: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .snap-container::-webkit-scrollbar { display: none; }

    .story-page {
      height: 100vh;
      width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 64px 16px 20px 16px;
    }

    .inshorts-card {
      width: 100%;
      max-width: 460px;
      height: 100%;
      max-height: 680px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }

    .card-image-box {
      width: 100%;
      height: 42%;
      position: relative;
      background: #000;
      flex-shrink: 0;
    }

    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-tag {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    .card-body {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .story-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .story-desc {
      font-size: 0.96rem;
      line-height: 1.85;
      color: var(--muted);
      overflow-y: auto;
      scrollbar-width: none;
    }
    .story-desc::-webkit-scrollbar { display: none; }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .action-icons {
      display: flex;
      gap: 16px;
    }

    .action-icons i {
      cursor: pointer;
      font-size: 1rem;
    }
    .action-icons i:hover { color: var(--primary); }

    .desktop-arrows {
      position: fixed;
      left: 30px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 100;
    }

    .arrow-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .arrow-btn:hover { background: var(--primary); color: #000; }

    .status-msg {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 70vh;
      color: var(--muted);
      gap: 12px;
      font-size: 1.1rem;
    }

    @media (max-width: 600px) {
      .desktop-arrows { display: none; }
      .story-page { padding: 54px 0 0 0; }
      .inshorts-card {
        border-radius: 0;
        border: none;
        max-height: 100%;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>🇮🇳</span>
      <span class="brand-text">خبر نامہ</span>
    </div>
    <div style="font-size: 0.8rem; color: var(--muted);">
      ایک وقت میں ایک خبر ⬇
    </div>
  </header>

  <div class="desktop-arrows">
    <button class="arrow-btn" onclick="scrollCard(-1)" title="پچھلی خبر"><i class="fa-solid fa-chevron-up"></i></button>
    <button class="arrow-btn" onclick="scrollCard(1)" title="اگلی خبر"><i class="fa-solid fa-chevron-down"></i></button>
  </div>

  <main class="snap-container" id="snapContainer">
    <div class="status-msg">
      <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: var(--primary);"></i>
      <p>خبریں لوڈ ہو رہی ہیں...</p>
    </div>
  </main>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = "https://ddgpqqazihycjvkwrusd.supabase.co";
    // Paste your publishable key (sb_publishable_...) below:
    const SUPABASE_ANON_KEY = "PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE";

    const container = document.getElementById('snapContainer');

    function scrollCard(direction) {
      const cardHeight = window.innerHeight;
      container.scrollBy({ top: direction * cardHeight, behavior: 'smooth' });
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') scrollCard(1);
      if (e.key === 'ArrowUp') scrollCard(-1);
    });

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'ur-IN';
      window.speechSynthesis.speak(utt);
    }

    function shareArticle(title, url) {
      if (navigator.share) {
        navigator.share({ title: title, url: url || window.location.href });
      } else {
        navigator.clipboard.writeText(url || window.location.href);
        alert('لنک کاپی کر لیا گیا!');
      }
    }

    async function fetchNews() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/news?select=*&order=created_at.desc&limit=25`, {
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const news = await response.json();

        if (!news || news.length === 0) {
          container.innerHTML = `
            <div class="status-msg">
              <i class="fa-regular fa-newspaper fa-2x"></i>
              <p>فی الحال کوئی خبر دستیاب نہیں ہے۔</p>
            </div>
          `;
          return;
        }

        container.innerHTML = '';
        news.forEach(item => {
          const page = document.createElement('section');
          page.className = 'story-page';
          page.innerHTML = `
            <article class="inshorts-card">
              <div class="card-image-box">
                <img class="card-image" src="${item.image_url || 'https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&w=800&q=80'}" alt="News Image">
                <span class="card-tag">${item.source_name || 'قومی'}</span>
              </div>
              <div class="card-body">
                <div>
                  <h2 class="story-title">${item.title}</h2>
                  <p class="story-desc">${item.summary}</p>
                </div>
                <div class="card-footer">
                  <a href="${item.source_url}" target="_blank" style="color:var(--primary);text-decoration:none;font-weight:600;">مکمل خبر پڑھیں</a>
                  <div class="action-icons">
                    <i class="fa-solid fa-volume-high" onclick="speakText('${item.title}')" title="سنیں"></i>
                    <i class="fa-regular fa-share-from-square" onclick="shareArticle('${item.title}', '${item.source_url}')" title="شیئر"></i>
                  </div>
                </div>
              </div>
            </article>
          `;
          container.appendChild(page);
        });

      } catch (err) {
        console.error("Fetch error:", err);
        container.innerHTML = `
          <div class="status-msg">
            <i class="fa-solid fa-triangle-exclamation fa-2x" style="color: #ef4444;"></i>
            <p>خبریں لوڈ کرنے میں مسئلہ پیش آیا۔ براہِ کرم API Key چیک کریں۔</p>
          </div>
        `;
      }
    }

    fetchNews();
  </script>
</body>
</html>
